name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - name: Tests (includes oracle cross-validation)
        run: go test ./...
      - name: Race detector
        run: go test -race ./engine/
      - run: go build ./...
