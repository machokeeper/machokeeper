name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 6 * * *" # daily: real-binary validation against cache.nixos.org
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
      - run: go vet ./...
      - name: Tests with race detector (includes oracle cross-validation)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: latest

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
      - name: Fuzz the parser (bounded)
        run: |
          for t in FuzzDetect FuzzCheck FuzzRepair; do
            go test ./engine/ -run '^$' -fuzz="^$t$" -fuzztime=60s
          done

  nix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - run: nix flake check
      - run: nix build .#default
      - run: ./result/bin/machokeeper help

  # Real-binary validation against cache.nixos.org: expensive and
  # network/cache-dependent, so it runs on schedule and on demand, not on
  # every PR. Fetches genuinely broken binaries named by the scope scanner
  # and drives the shipped tool against them.
  real-binaries-linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - run: go build -o machokeeper ./cmd/machokeeper
      - name: Validate against real broken cache binaries
        run: |
          python3 -u scripts/validate-real-binaries.py "$PWD/machokeeper" --channel darwin --n 4
          python3 -u scripts/validate-real-binaries.py "$PWD/machokeeper" --channel unstable --n 4

  real-binaries-darwin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - run: go build -o machokeeper ./cmd/machokeeper
      - name: Functional test — repair, then Apple's codesign must accept
        run: bash scripts/darwin-functional.sh "$PWD/machokeeper"
