name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, upload assets
  id-token: write # provenance attestation signing
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"

      - name: Build reproducibly for every supported platform
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-trimpath"
        run: |
          version="${GITHUB_REF_NAME}"
          # The tag is interpolated into -ldflags (split on whitespace by
          # go); only plain vX.Y.Z[-suffix] tags may reach it.
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to build non-semver tag: $version"; exit 1 ;;
          esac
          case "$version" in
            *[!A-Za-z0-9.-]*) echo "refusing tag with unexpected characters: $version"; exit 1 ;;
          esac
          mkdir -p dist
          for pair in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${pair%/*}"; arch="${pair#*/}"
            out="dist/machokeeper-${version}-${os}-${arch}"
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.version=${version}" \
              -o "$out" ./cmd/machokeeper
          done
          cd dist && sha256sum machokeeper-* > SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/machokeeper.spdx.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: dist/machokeeper-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
